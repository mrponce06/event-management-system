{% extends "base.html" %}
{% block content %}
<h3>Edit Event</h3>
<form method="POST" class="form-inline">
    <input type="text" name="title" value="{{ event.title }}" placeholder="Event Title" required>
    <input type="date" name="event_date" value="{{ event.event_date }}" required>
    <input type="text" name="venue" value="{{ event.venue }}" placeholder="Venue" required>
    <input type="number" name="capacity" min="1" value="{{ event.capacity }}" placeholder="Capacity" required>
    <button type="submit">Update Event</button>
</form>
<a href="{{ url_for('manage_events') }}" style="display:inline-block; margin-top:10px; text-decoration:none; color:#3498db;">&larr; Back to Events</a>
{% endblock %}
