{% extends "base.html" %}
{% block content %}
<h3>Manage Participants</h3>
<form method="POST" class="form-inline">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="contact" placeholder="Contact Number / Email" required>
    <button type="submit">Register Participant</button>
</form>

<table>
    <tr><th>ID</th><th>Name</th><th>Contact Info</th><th>Action</th></tr>
    {% for p in participants %}
    <tr>
        <td>{{ p.participant_id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.contact }}</td>
        <td>
            <a href="{{ url_for('edit_participant', participant_id=p.participant_id) }}"><button type="button" class="btn-warning">Edit</button></a>
            <form action="{{ url_for('delete_participant', participant_id=p.participant_id) }}" method="POST" style="display:inline;">
                <button type="submit" class="btn-danger" onclick="return confirm('Delete this participant?');">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
